<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>Now Playing | Spotify Clone</title>
</head>
<body>
    <main class="player-page">
        <a class="player-back" href="index.html"><i class="fa-solid fa-arrow-left"></i> Home</a>
        <section class="player-hero">
            <img id="heroSongCover" src="assets/album_picture.jpeg" alt="Now playing cover">
            <div class="player-hero-main">
                <div class="player-kicker">Now playing</div>
                <div class="player-hero-actions">
                    <button class="hero-play-button" id="heroPlayButton" type="button" aria-label="Play current song">
                        <i class="fa-solid fa-play"></i>
                    </button>
                    <button class="hero-side-action" id="addToPlaylistButton" type="button" aria-label="Add to playlist">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                    <button class="hero-side-action" id="heroDownloadButton" type="button" aria-label="Download song">
                        <i class="fa-solid fa-download"></i>
                    </button>
                </div>
                <h1 id="heroSongTitle">Choose a song</h1>
                <p id="heroSongArtist">Preview music from the catalog</p>
            </div>
        </section>
        <section class="player-list">
            <form id="playerSearchForm" class="player-search" autocomplete="off">
                <input id="playerSearchInput" type="search" placeholder="Search songs, artists, or albums" aria-label="Search songs, artists, or albums">
                <button type="submit"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
            </form>
            <h2 id="catalogHeading">Song catalog</h2>
            <div id="playerCatalog"></div>
        </section>
    </main>
    <div class="musicplayer">
        <div class="album">
            <img class="image" id="playerCover" src="assets/album_picture.jpeg" alt="Now playing cover">
            <div class="name"><p class="song" id="playerSongTitle">Choose a song</p><p class="singer" id="playerSongArtist">Preview music from the catalog</p></div>
            <button class="emoji1 like-button" id="likeButton" type="button" aria-label="Like song" title="Like song"><i class="fa-regular fa-heart"></i></button>
        </div>
        <div class="player">
            <div class="player-controls">
                <button class="player-button" id="previousTrack" aria-label="Previous song"><i class="fa-solid fa-backward-step"></i></button>
                <button class="player-button player-main-button" id="playToggle" aria-label="Play song"><i class="fa-solid fa-play"></i></button>
                <button class="player-button" id="nextTrack" aria-label="Next song"><i class="fa-solid fa-forward-step"></i></button>
            </div>
            <div class="playback-bar"><span class="curr-time" id="currentTime">0:00</span><input type="range" min="0" max="100" value="0" id="progressControl" class="progess-bar"><span class="tot-time" id="totalTime">0:00</span></div>
        </div>
        <div class="controls">
            <i class="fa-solid fa-volume-high"></i>
            <input class="volume" id="volumeControl" type="range" min="0" max="100" value="80">
            <button class="download-btn" id="downloadTrack" type="button" title="Download this song"><i class="fa-solid fa-download"></i> Download</button>
        </div>
        <audio id="globalAudio" preload="metadata"></audio>
    </div>
  <!-- Playlist Selection Modal -->
    <div id="playlistModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add to Playlist</h2>
                <button class="modal-close" id="playlistModalClose" type="button" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <div id="playlistList" class="playlist-list">
                    <!-- Populated by JavaScript -->
                </div>
            </div>
            <div class="modal-footer">
                <button id="createNewPlaylistBtn" class="badge" type="button">
                    <i class="fa-solid fa-plus"></i> Create New Playlist
                </button>
            </div>
        </div>
    </div>
    <!-- Modal Overlay -->
    <div id="playlistModalOverlay" class="modal-overlay" style="display: none;" onclick="document.querySelector('#playlistModalClose').click()"></div>

    <!-- Toast Notification -->
    <div id="toastNotification" class="toast" style="display: none;">
        <div class="toast-content">
            <i class="fa-solid fa-check-circle"></i>
            <div class="toast-text">
                <p class="toast-title">Added to Playlist</p>
                <p class="toast-message" id="toastMessage"></p>
            </div>
        </div>
    </div>

    <script src="player.js"></script>
</body>
</html>
