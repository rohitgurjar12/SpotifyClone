<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" href="./assets/logo.png" />
    <title>Spotify - Login</title>
</head>

<body style="background: linear-gradient(135deg, #1DB954, #000000);">
    <div class="login-container">
        <div class="login-box">
            <img src="assets/logo.png" alt="Spotify Logo" class="login-logo">
            <h1>Welcome back</h1>
            <p class="login-subtitle">Your Music, Your Way</p>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">Email or username</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>

                <button type="submit" class="login-btn">Log In</button>
            </form>


            <div class="login-divider">OR</div>

            <div class="social-login">
                <button type="button" class="social-btn google-btn">
                    <i class="fab fa-google"></i>
                    <span>Sign in with Google</span>
                </button>
                <button type="button" class="social-btn facebook-btn">
                    <i class="fab fa-facebook"></i>
                    <span>Sign in with Facebook</span>
                </button>
                <button type="button" class="social-btn apple-btn">
                    <i class="fab fa-apple"></i>
                    <span>Continue with Apple</span>
                </button>
                <button type="button" class="social-btn phone-btn" onclick="showPhoneInput()">
                    <i class="fas fa-phone"></i>
                    <span>Continue with Phone Number</span>
                </button>
            </div>

            <div id="phoneInputSection" class="phone-input-section" style="display: none;">
                <input type="tel" id="phoneNumber" placeholder="Enter your phone number" class="phone-input">
                <button type="button" class="login-btn" onclick="continueWithPhone()">Continue</button><br/>
                <button type="button" class="cancel-btn" onclick="cancelPhoneInput()">Cancel</button>
            </div>

            <div class="login-footer">
                <p>Don't have an account? <a href="#" class="signup-link">Sign Up</a></p>
            </div>
        </div>
    </div>

    <script>
        function showPhoneInput() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('phoneInputSection').style.display = 'block';
        }

        function cancelPhoneInput() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('phoneInputSection').style.display = 'none';
            document.getElementById('phoneNumber').value = '';
        }

        function getUsers() {
            try {
                return JSON.parse(localStorage.getItem('spotifyUsers') || '[]');
            } catch {
                return [];
            }
        }

        function continueWithPhone() {
            const phone = document.getElementById('phoneNumber').value.trim();
            if (phone.length < 10) {
                alert('Please enter a valid phone number');
                return;
            }
            localStorage.setItem('spotifyUser', JSON.stringify({
                phone: phone,
                loggedIn: true,
                loginTime: new Date().toLocaleString()
            }));
            window.location.href = 'index.html';
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const users = getUsers();
            const matchedUser = users.find((user) => String(user.email || '').toLowerCase() === email.toLowerCase());

            if (!email || !password) {
                alert('Please enter both email and password.');
                return;
            }

            if (matchedUser && matchedUser.password !== password) {
                alert('Incorrect password. Please try again.');
                return;
            }

            if (!matchedUser) {
                alert('No account found for this email. Please sign up first.');
                window.location.href = 'signup.html';
                return;
            }

            localStorage.setItem('spotifyUser', JSON.stringify({
                name: matchedUser.name || matchedUser.email,
                email: matchedUser.email,
                loggedIn: true,
                loginTime: new Date().toLocaleString(),
                password: matchedUser.password
            }));
            window.location.href = 'index.html';
        });

        document.querySelector('.signup-link').addEventListener('click', function() {
            window.location.href = 'signup.html';
        });
    </script>
</body>

</html>
